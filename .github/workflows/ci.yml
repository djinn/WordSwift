# CI pipeline for WordSwift
#
# Build artifacts:
#   - wordswift_*.deb  (Debian/Ubuntu package)
#   - wordswift:ref    (Docker image, tagged with the branch/ref)
#   - wordswift:latest (Docker image, on main only)
#
# The .deb is only produced on Ubuntu runners (needs debhelper). The container
# image is produced on all pushes; if you want GitHub Packages, set
# REGISTRY and IMAGE_NAME secrets or adapt the `docker tag` step.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Change these to push to your registry.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --------------------------------------------------------------------------
  # Test — unit test suite on all supported Python versions.
  # --------------------------------------------------------------------------
  test:
    name: "Test Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (plyvel / LevelDB)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libleveldb-dev libsnappy-dev 2>&1 | tail -5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: |
          python tests/test_api.py

  # --------------------------------------------------------------------------
  # Build .deb — requires debhelper from the Ubuntu repos.
  # --------------------------------------------------------------------------
  deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper dh-python lintian 2>&1 | tail -5

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b -rfakeroot

      - name: Lint the .deb
        run: |
          lintian --tag-display-limit 0 ../wordswift_*.deb

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordswift-deb
          path: ../wordswift_*.deb
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Build Docker image.
  # --------------------------------------------------------------------------
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch, optional)
        uses: docker/setup-qemu-action@v3
        if: ${{ vars.REGISTRY && vars.IMAGE_NAME }}
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max