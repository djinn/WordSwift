# systemd-sysusers.d snippet — provisions the `wordswift` system user.
#
# Installed to /usr/lib/sysusers.d/wordswift.conf. systemd-sysusers creates the
# account on stateless/immutable systems and during package installation.
#
# Format: type name id gecos [home] [shell]
u wordswift - "WordSwift search engine" /var/lib/wordswift /usr/sbin/nologin
