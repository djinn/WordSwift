# systemd-tmpfiles.d snippet — provisions WordSwift's state directory.
#
# Installed to /usr/lib/tmpfiles.d/wordswift.conf. tmpfiles.d creates the
# directory with the correct owner and mode at boot and on package install, so
# the service does not need to run as root just to create its own data dir.
#
# Format: type path mode uid gid age argument
#
#  d  = create directory if missing (do not touch existing contents)
#  The trailing "-" for age means "never clean up automatically" — indexes must
#  survive tmpfiles housekeeping.
d /var/lib/wordswift 0750 wordswift wordswift -

# Optional drop-in config directory for /etc/wordswift/wordswift.env.
d /etc/wordswift 0755 root root -
